apiVersion: v1
kind: Secret
metadata:
  name: messager-db-secret
type: Opaque
stringData:
  POSTGRES_USER: "messager"
  POSTGRES_PASSWORD: "change-me-messager-password"
  USER_DB_DSN: "host=postgres user=messager password=change-me-messager-password dbname=messager_users sslmode=disable"
  MSG_DB_DSN: "host=postgres user=messager password=change-me-messager-password dbname=messager_messages sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
type: Opaque
stringData:
  accessKeyID: "messager-minio"
  secretAccessKey: "change-me-minio-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: csi-s3-secret
  namespace: messager
type: Opaque
stringData:
  accessKeyID: "messager-minio"
  secretAccessKey: "change-me-minio-secret"
